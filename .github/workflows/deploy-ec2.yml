name: Deploy to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revive-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate before deployment
        run: |
          pip install -r requirements.txt
          bash scripts/check.sh
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/projects/revive-thrive-business-platform
            git fetch origin main
            git checkout --detach "${{ github.sha }}"
            venv/bin/pip install -r requirements.txt
            PYTHON_BIN=venv/bin/python bash scripts/check.sh
            sudo systemctl restart revive-thrive
            sudo systemctl reload nginx
            curl -fsS http://127.0.0.1/health
